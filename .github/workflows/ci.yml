name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: 编译
        run: npm run build

      - name: 单元测试
        run: npm test

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm test -- --run
      - working-directory: web
        run: npm run build

  production-image:
    runs-on: ubuntu-latest
    needs: [build-test, web-test]
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Compose 配置
        env:
          ECHO_PUBLIC_DOMAIN: memory.example.test
        run: docker compose --env-file .env.production.example config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: echo-agent-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eval:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # 跑评估:env 注入满足配置要求;ECHO_DISABLE_LOGIN_THROTTLE 关闭登录限流;
      # ECHO_DISABLE_LOGIN_THROTTLE=1 让 eval 跑得过 fixture 准备。
      - name: 跑黄金评估集
        env:
          ECHO_JWT_SECRET: 'eval-ci-secret-with-enough-length-32'
          ECHO_MASTER_KEY: 'eval-ci-master-key-base64-padded'
          ECHO_ADMIN_USER: admin
          ECHO_ADMIN_PASSWORD: 'admin-pw-12345-ci'
          ECHO_EVAL_USERS: 'u_member_1:um1-password,u_member_2:um2-password,u_member_fin:ufin-password'
          ECHO_RATE_LIMIT_RETRIEVE: '0'
          ECHO_RATE_LIMIT_LLM: '0'
        run: bash eval/ci.sh

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
          if-no-files-found: ignore
