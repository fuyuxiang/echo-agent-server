server {
    listen 8787 ssl;
    listen [::]:8787 ssl;
    server_name 10.132.19.82;

    ssl_certificate     /etc/nginx/ssl/echo-agent-server/server.crt;
    ssl_certificate_key /etc/nginx/ssl/echo-agent-server/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EchoAgentTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200m;

    access_log /var/log/nginx/echo-agent-server-access.log;
    error_log  /var/log/nginx/echo-agent-server-error.log;

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Knowledge answers use SSE and must reach the desktop incrementally.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
